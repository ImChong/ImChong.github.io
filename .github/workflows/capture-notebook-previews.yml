name: Capture Notebook Project Previews

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  capture:
    if: github.head_ref == 'chore/refresh-notebook-previews-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow playwright
          python -m playwright install --with-deps chromium
      - name: Capture fresh EN/ZH project homepages
        run: |
          python scripts/capture_project_previews.py --only robotics-notebooks robot-learning-paper-notebooks
      - name: Commit regenerated previews to this PR branch
        run: |
          git add img/projects/robotics-notebooks-{en,zh}.webp img/projects/robot-learning-paper-notebooks-{en,zh}.webp
          if git diff --cached --quiet; then
            echo 'Screenshots unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '更新两个机器人笔记项目的中英文首页截图'
          git push origin "HEAD:${{ github.head_ref }}"
