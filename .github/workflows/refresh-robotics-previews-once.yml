# Temporary one-shot workflow. Removes itself in the screenshot commit.
name: Refresh robotics project previews (one shot)

on:
  push:
    branches:
      - chore/refresh-robotics-previews-20261123

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow playwright
          python -m playwright install --with-deps chromium
      - name: Capture latest Chinese and English homepages
        run: |
          python scripts/capture_project_previews.py --only robotics-notebooks robot-learning-paper-notebooks
      - name: Commit updated images and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/projects/robotics-notebooks-en.webp img/projects/robotics-notebooks-zh.webp img/projects/robot-learning-paper-notebooks-en.webp img/projects/robot-learning-paper-notebooks-zh.webp
          git rm .github/workflows/refresh-robotics-previews-once.yml
          git commit -m "更新 Robotics Notebooks 与论文笔记中英文截图"
          git push origin HEAD:chore/refresh-robotics-previews-20261123
